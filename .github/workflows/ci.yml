name: Clinical classification checks
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  python-and-browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and test requirements
        run: python -m pip install -e ".[test]"
      - name: Check dependencies and syntax
        run: |
          python -m pip check
          python -m compileall -q kdigo_heatmap.py cli.py agents tests
          node --check web/classifier.js
          node --check web/app.js
      - name: Python regression tests
        run: |
          export AUDIT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(40))')"
          python -m pytest -q
      - name: Browser classifier regression tests
        run: node --test web/test_classifier.cjs
